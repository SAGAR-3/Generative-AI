version: "3.9"

# ══════════════════════════════════════════════════════════════════════
# BankRAG: Production-Grade RAG Pipeline Infrastructure
# ══════════════════════════════════════════════════════════════════════
# Services:
#   - qdrant:     Vector database (port 6333)
#   - redis:      Query caching (port 6379)
#   - postgres:   Audit log database (port 5432)
#   - prometheus: Metrics collection (port 9090)
#   - grafana:    Metrics dashboard (port 3000)
#   - bankrag:    The RAG API itself (port 8000)
#
# Start:  docker-compose up -d
# Stop:   docker-compose down
# Logs:   docker-compose logs -f bankrag
# ══════════════════════════════════════════════════════════════════════

services:

  # ── Vector Database ────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.11.3
    container_name: bankrag-qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - bankrag-net

  # ── Cache ──────────────────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: bankrag-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-bankrag-redis-pass} --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-bankrag-redis-pass}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - bankrag-net

  # ── Audit Database ─────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: bankrag-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: bankrag_db
      POSTGRES_USER: bankrag
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bankrag-db-pass}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bankrag -d bankrag_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - bankrag-net

  # ── Metrics Collection ─────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: bankrag-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=90d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "-O-", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - bankrag-net

  # ── Metrics Dashboard ──────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.2.0
    container_name: bankrag-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-bankrag-grafana-pass}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "-O-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - bankrag-net

  # ── BankRAG API ────────────────────────────────────────────────────
  bankrag:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: bankrag-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      QDRANT_HOST: qdrant
      REDIS_HOST: redis
      DATABASE_URL: postgresql+asyncpg://bankrag:${DB_PASSWORD:-bankrag-db-pass}@postgres:5432/bankrag_db
      ENVIRONMENT: production
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data:ro
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - bankrag-net

# ── Networks ────────────────────────────────────────────────────────

networks:
  bankrag-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ── Volumes ─────────────────────────────────────────────────────────

volumes:
  qdrant_data:
    driver: local
  redis_data:
    driver: local
  postgres_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
